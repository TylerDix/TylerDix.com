<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pointless</title>
    <meta name="description" content="Pointless Websites. One word. Tap it.">
    <meta property="og:title" content="Pointless Websites">
    <meta property="og:description" content="One word. Tap it.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pointless-websites.com/">
    <meta property="og:image" content="https://pointless-websites.com/wealth/hero.jpg">
    <meta name="theme-color" content="#04050a">
    <meta name="color-scheme" content="dark">
    <link rel="canonical" href="https://pointless-websites.com/">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg:        #04050a;
            --ink:       #f4f5f7;
            --muted:     #6b7180;
            --gold:      #ffcb45;
            --gold-deep: #d99a16;
        }
        html, body { height: 100%; }
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
        }
        #stars { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
        .vignette {
            position: fixed; inset: 0; pointer-events: none; z-index: 1;
            background: radial-gradient(58% 58% at 50% 50%, transparent 24%, rgba(4,5,10,0.55) 76%, rgba(4,5,10,0.95) 100%);
        }
        .stage {
            position: fixed; inset: 0; z-index: 2;
            display: flex; align-items: center; justify-content: center;
            transition: opacity .6s ease, transform .6s ease;
        }
        .stage.go { opacity: 0; transform: scale(1.18); }

        .word {
            display: inline-block;
            font-weight: 850;
            font-size: clamp(2.8rem, 16vw, 9rem);
            letter-spacing: -0.04em;
            line-height: 1;
            color: var(--gold);
            background: none; border: 0; padding: 0; margin: 0;
            font-family: inherit; cursor: pointer;
            text-shadow: 0 0 60px rgba(255,203,69,0.35);
            -webkit-tap-highlight-color: transparent;
            transition: text-shadow .35s ease, transform .25s ease, letter-spacing .35s ease;
            animation: breathe 4.5s ease-in-out infinite;
        }
        .word:hover, .word:focus-visible {
            outline: none;
            text-shadow: 0 0 90px rgba(255,203,69,0.7);
            letter-spacing: -0.02em;
        }
        .word:active { transform: scale(0.97); }
        @keyframes breathe {
            0%, 100% { text-shadow: 0 0 48px rgba(255,203,69,0.30); }
            50%      { text-shadow: 0 0 78px rgba(255,203,69,0.52); }
        }

        .hint {
            position: fixed; left: 0; right: 0; bottom: 34px; z-index: 2;
            text-align: center; color: var(--muted);
            font-size: 0.74rem; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase;
            opacity: 0; animation: fadein 1.2s ease 1.1s forwards;
        }
        @keyframes fadein { to { opacity: 1; } }

        @media (prefers-reduced-motion: reduce) {
            .word { animation: none; }
            .stage, .word { transition: none; }
            .hint { animation: none; opacity: 1; }
        }
    </style>
</head>
<body>
    <canvas id="stars" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <main class="stage" id="stage">
        <a class="word" id="enter" href="/wealth/" aria-label="Enter">pointless</a>
    </main>
    <p class="hint" aria-hidden="true">tap the word</p>

    <script>
    (function () {
        "use strict";
        var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        /* ---------- drifting starfield (echoes the tunnel) ---------- */
        var cv = document.getElementById("stars");
        var g = cv.getContext("2d");
        var DPR = Math.min(window.devicePixelRatio || 1, 2);
        var W = 0, H = 0, cx = 0, cy = 0, focal = 600;
        function resize() {
            W = cv.clientWidth = window.innerWidth;
            H = cv.clientHeight = window.innerHeight;
            cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
            g.setTransform(DPR, 0, 0, DPR, 0, 0);
            cx = W / 2; cy = H / 2; focal = Math.max(W, H) * 0.8;
        }
        resize();
        window.addEventListener("resize", resize);

        var N = (window.innerWidth < 700) ? 130 : 260;
        var stars = [];
        function spawn(s) { s.x = Math.random() - 0.5; s.y = Math.random() - 0.5; s.z = Math.random() * 0.6 + 0.4; s.gold = Math.random() < 0.5; return s; }
        for (var i = 0; i < N; i++) stars.push(spawn({}));

        var speed = 0.06, target = 0.06, lastTs = null, launching = false;
        function draw(dz) {
            g.fillStyle = "rgba(4,5,10,0.22)";
            g.fillRect(0, 0, W, H);
            for (var i = 0; i < stars.length; i++) {
                var s = stars[i];
                s.z -= dz;
                if (s.z <= 0.04) { spawn(s); s.z = 1; continue; }
                var k = focal / s.z;
                var sx = cx + s.x * k, sy = cy + s.y * k;
                if (sx < -60 || sx > W + 60 || sy < -60 || sy > H + 60) { spawn(s); s.z = 1; continue; }
                var b = 1 - s.z;
                var r = Math.max(0.5, b * 2.6);
                g.beginPath();
                g.fillStyle = s.gold
                    ? "rgba(255," + (188 + Math.floor(b * 60)) + ",80," + (0.18 + b * 0.7) + ")"
                    : "rgba(220,228,255," + (0.10 + b * 0.55) + ")";
                g.arc(sx, sy, r, 0, 6.2832);
                g.fill();
            }
        }
        function frame(ts) {
            if (lastTs == null) lastTs = ts;
            var dt = Math.min(0.05, (ts - lastTs) / 1000); lastTs = ts;
            speed += (target - speed) * Math.min(1, dt * 3);
            draw(speed * dt);
            requestAnimationFrame(frame);
        }
        if (reduce) { draw(0); } else { requestAnimationFrame(frame); }

        /* ---------- the tap: unlock + dive into the tunnel ---------- */
        var enter = document.getElementById("enter");
        var stage = document.getElementById("stage");
        function go(e) {
            if (e) e.preventDefault();
            if (launching) return;
            launching = true;
            // set the unlock the gated page checks for
            document.cookie = "w=1; max-age=31536000; path=/; SameSite=Lax";
            if (reduce) { window.location.href = "/wealth/"; return; }
            target = 3.4;                 // stars surge forward
            stage.classList.add("go");    // word fades + zooms
            setTimeout(function () { window.location.href = "/wealth/"; }, 560);
        }
        enter.addEventListener("click", go);
    })();
    </script>
</body>
</html>
